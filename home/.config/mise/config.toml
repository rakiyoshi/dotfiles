conftest = "0.56.0"
golangci-lint = "2.4.0"
opa = "1.1.0"
reviewdog = "0.20.3"
shellcheck = "0.10.0"
slsa-verifier = "2.7.1"
tflint = "0.55.0"
tfsec = "1.28.14"
tfmigrate = "0.4.6"
trivy = "0.76.1"
"aqua:int128/ghcp" = "1.15.3"
"aqua:suzuki-shunsuke/ci-info" = "2.4.4"
"aqua:suzuki-shunsuke/github-comment" = "6.3.1"
"aqua:suzuki-shunsuke/tfcmt" = "4.14.20"
"go:github.com/hashicorp/terraform-config-inspect" = "d2d12f9a63bbb1fe34ea81ec84c9cb11d8514c17"

[settings]
