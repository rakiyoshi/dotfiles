[tools]
terraform = ["1.1.8", "1.13.5"]
ruby = "4.0.9"
python = "3.14.2"
go = ["1.24.2", "1.27.1"]
node = "16.13.0"
direnv = "2.36.0"
helm = "4.3.1"
kubectl = "1.23.1"
starship = "1.27.0"
